name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, and a token left in .git/config travels with an upload.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # The two remaining shell tests exec hooks that open with a zsh shebang. The Python
      # tests pipe Japanese through subprocess in text mode, which reads the locale encoding,
      # and this image does not generate en_US.UTF-8.
      - name: Install zsh and generate the locale
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh locales
          sudo locale-gen en_US.UTF-8

      # node_modules is not tracked; the lockfile is. The root install is what puts
      # oxlint on PATH for the static-gate tests, which reach for it through npx. The
      # textlint hook runs from this same root, where .textlintrc.json sits beside
      # node_modules.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Node tests
        run: >
          node --test
          "tests/*.test.js"
          "agents/**/tests/*.test.js"
          "hooks/**/tests/*.test.js"
          "skills/**/tests/*.test.js"
          "workflows/**/tests/*.test.js"

      # hooks/edit/tests/rumdl_check_test.py runs the real binary. The rumdl step below
      # reaches it through `pipx run`, which puts nothing on PATH for this step.
      - name: Install rumdl
        run: pipx install rumdl==0.2.58

      # Not unittest discovery: it cannot recurse from the root, where the test
      # directories are not packages.
      - name: Python tests
        run: find agents hooks skills workflows -name '*_test.py' -print0 | xargs -0 -r -n1 python3

      # glob でなく find なのは、bash 3.2 に globstar が無く ** の階層解釈が版で割れるため。
      # Python tests と同じ形で、階層が増えても suite を落とさない。-t が実行行を stderr へ出す。
      - name: Shell tests
        run: find hooks -name '*.test.sh' -print0 | xargs -0 -r -n1 -t bash

      # 3 つとも hook か手元でしか走っておらず、指摘が溜まっても誰も気付かなかった。
      # oxlint と textlint は devDependency なので、上の Install がそのまま入れる。
      - name: oxlint
        run: npx oxlint

      # クォートしたまま渡し、glob の展開は textlint 側にさせる。シェルに展開させると
      # globstar の有無で対象ファイル数が変わる。
      - name: textlint
        run: npx textlint '.ja/**/*.md'

      # ruff は JS 依存に無いので版を直に固定する。手元は uvx ruff (2026-08-21 時点 0.16.4)。
      - name: ruff
        run: pipx run --spec ruff==0.16.4 ruff check .

      - name: ruff format
        run: pipx run --spec ruff==0.16.4 ruff format --check .

      # rumdl は JS 依存に無いので版を直に固定する。ruff と同じ形。`fmt` でなく `check` なのは、
      # コードスパン内の末尾スペースと見出しレベルで、自動修正が内容を壊す実例が出たため (#329)。
      - name: rumdl
        run: pipx run --spec rumdl==0.2.58 rumdl check .
